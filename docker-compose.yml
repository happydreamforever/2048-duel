# Starts MySQL and the 2048 Duel server together:  docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: duel2048
      MYSQL_USER: duel2048
      MYSQL_PASSWORD: duel2048
      MYSQL_ROOT_PASSWORD: change-me-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uduel2048", "-pduel2048"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/duel2048
      DB_USER: duel2048
      DB_PASSWORD: duel2048
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:

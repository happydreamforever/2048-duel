# JVM args for the Gradle daemon. preferIPv4Stack is needed on hosts whose IPv6 route to dl.google.com is broken.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Windows locks Kotlin incremental caches (dirty-sources.txt) when a daemon is still running.
kotlin.incremental=false
